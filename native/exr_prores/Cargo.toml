[package]
name = "exr_prores"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings: oxideav-prores 12-bit encode + minimal MOV mux for EXR Converter"
license = "MIT"
publish = false

[lib]
name = "exr_prores"
crate-type = ["cdylib"]

[dependencies]
oxideav-core = "0.1"
oxideav-prores = "=0.1.1"
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }

# oxideav-prores 0.1.1 writes 4:4:4 chroma blocks in the wrong order for
# FFmpeg and other standard decoders. Build against the vendored, patched copy
# until upstream fixes it. See vendor/oxideav-prores/EXR_CONVERTER_PATCH.md.
[patch.crates-io]
oxideav-prores = { path = "vendor/oxideav-prores" }

[profile.release]
lto = true
codegen-units = 1
