# Workflows pin actions by full SHA with trailing `# vX` comments so Dependabot
# can bump pins. Monthly + one grouped PR keeps CI runs (and minutes) low.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
