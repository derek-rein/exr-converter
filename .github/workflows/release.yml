# Tag format: v1.2.3
#
# Triggers:
#   1. push of tag v* (human / PAT push — GITHUB_TOKEN tag pushes do NOT fire this)
#   2. workflow_dispatch (Auto-tag after merge: --ref main -f tag=vX.Y.Z)
#   3. workflow_dispatch signing test (no GitHub Release):
#        gh workflow run Release --ref <branch> -f macos_only=true -f publish=false
#      Builds, Developer ID-signs, notarizes, and staples the two macOS DMGs
#      and uploads them as Actions artifacts. Does not publish.
#
# Gate: lint + full pytest suite (unit + integration) must pass on all
# platforms before any Nuitka build or GitHub Release is published.
# macos_only still runs that gate, then only the macOS build cells.
#
# Cosign OIDC identity for workflow_dispatch (normal auto-tag path) is:
#   …/release.yml@refs/heads/main
# For a human tag-push trigger it is …@refs/tags/vX.Y.Z.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Real release (Auto-tag): gh workflow run Release --ref main -f tag=v0.5.2
    # Workflow *file* comes from --ref. Source *code* is checked out from
    # source_ref (default = tag). Re-dispatching an old tag without a new tag
    # will NOT pick up packaging fixes that only exist on main.
    #
    # Signing test (no publish), after this file is on the ref you pass:
    #   gh workflow run Release --ref <branch> -f macos_only=true -f publish=false
    # macos_only forces publish off. It checks out that ref (not a tag) unless
    # source_ref is set, and uploads the notarized DMGs as Actions artifacts.
    inputs:
      tag:
        description: "Release tag (vX.Y.Z). Required when publish is true. Not used as the checkout ref for macos_only."
        required: false
        type: string
        default: ""
      source_ref:
        description: "Git ref to build. Default: the tag when publishing; this workflow ref for macos_only."
        required: false
        type: string
        default: ""
      publish:
        description: "Create the GitHub Release. Default true. Ignored when macos_only is true (never publishes)."
        required: false
        type: boolean
        default: true
      macos_only:
        description: "Sign and notarize only the macOS DMGs. Upload Actions artifacts. Do not publish a GitHub Release."
        required: false
        type: boolean
        default: false

# One pipeline per tag across push:tags and workflow_dispatch. A macOS signing
# test uses its own group so it does not queue behind a real release.
# Never cancel an in-flight Nuitka build — queue the newer run instead.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_only && format('macos-sign-test-{0}', github.ref_name) || format('release-{0}', github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  NUITKA_ASSUME_YES_FOR_DOWNLOADS: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Published version / GitHub Release name. macos_only is not a release.
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && (inputs.macos_only && 'signing-test' || (inputs.tag != '' && inputs.tag || '')) || github.ref_name }}
  # Code to build. macos_only defaults to the ref the workflow was dispatched on.
  RELEASE_REF: ${{ github.event_name != 'workflow_dispatch' && github.ref_name || (inputs.source_ref != '' && inputs.source_ref || (inputs.macos_only && github.ref_name || (inputs.tag != '' && inputs.tag || github.ref_name))) }}

jobs:
  # ── Quality gate (must pass before build / sign / publish) ────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Validate tag, pyproject version, and CHANGELOG
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || '' }}
          MACOS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "${MACOS_ONLY}" = "true" ]; then
            echo "macos_only signing test: building ${RELEASE_REF}."
            echo "Not a release. Tag/changelog publish gates are skipped. No GitHub Release will be published."
            exit 0
          fi
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: RELEASE_TAG must be vX.Y.Z, got: ${TAG}" >&2
            exit 1
          fi
          PY=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$VERSION" != "$PY" ]; then
            # Emergency rebuild: explicit source_ref may diverge from the tag.
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$SOURCE_REF" ]; then
              echo "WARNING: emergency rebuild source_ref=${SOURCE_REF}; tag ${TAG} vs pyproject ${PY}"
            else
              echo "ERROR: tag ${TAG} does not match pyproject version ${PY} on ${RELEASE_REF}" >&2
              exit 1
            fi
          else
            echo "OK: tag ${TAG} matches pyproject ${PY} on ${RELEASE_REF}"
          fi
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing '## [${VERSION}]' section — refuse to ship" >&2
            exit 1
          fi
          if ! grep -qE "^\[${VERSION}\]:" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing compare link '[${VERSION}]:' at bottom" >&2
            exit 1
          fi
          echo "OK: CHANGELOG has section and compare link for ${VERSION}"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          # Same key as test (ubuntu) so we can restore what test saved;
          # do not save here or we race the concurrent test matrix cell.
          cache-suffix: ${{ github.workflow }}
          save-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ruff check
        run: uv run ruff check src/ main.py tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ main.py tests/

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          # Separate from CI workflow jobs so concurrent CI+Release runs
          # don't fight over the same cache key (noisy annotations).
          cache-suffix: ${{ github.workflow }}
          prune-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Qt offscreen system libs (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install dependencies
        run: uv sync --group dev

      # Bundled ACES Studio is config v2.5 and needs library 2.5+.
      - name: Ensure OpenColorIO 2.5+ linkage
        run: uv run python scripts/ensure_ocio.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Build oxideav ProRes extension
        run: uv run python scripts/build_oxideav_prores.py

      - name: Run full test suite (unit + integration)
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -v

  # Blocks build until every lint + test matrix cell is green.
  gate:
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Require lint + all tests green before release build
        shell: bash
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "test=${{ needs.test.result }}"
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "ERROR: lint failed — aborting release" >&2
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "ERROR: tests failed — aborting release" >&2
            exit 1
          fi
          echo "Release gate passed — proceeding to build"

  # Job-level if cannot read matrix, so the target list is chosen here.
  # macos_only keeps the two DMG rows; a real release keeps all four.
  build-matrix:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - name: Choose build targets
        id: set
        env:
          MACOS_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.macos_only && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ "$MACOS_ONLY" = "true" ]; then
            echo "macos_only: macOS arm64 and x86_64 DMGs only. No GitHub Release."
            json='[
              {"os":"macos-latest","artifact":"exr_converter-macos-arm64","ext":"dmg"},
              {"os":"macos-26-intel","artifact":"exr_converter-macos-x86_64","ext":"dmg"}
            ]'
          else
            json='[
              {"os":"ubuntu-24.04","artifact":"exr_converter-linux-x86_64","ext":"AppImage"},
              {"os":"macos-latest","artifact":"exr_converter-macos-arm64","ext":"dmg"},
              {"os":"macos-26-intel","artifact":"exr_converter-macos-x86_64","ext":"dmg"},
              {"os":"windows-latest","artifact":"exr_converter-windows-x86_64-setup","ext":"exe"}
            ]'
          fi
          {
            echo "include<<EOF"
            echo "$json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: build-matrix
    # Nuitka + packaging can be slow; fail hung jobs instead of burning runner hours.
    # GitHub-hosted jobs cannot run longer than 6h. macOS uses that cap.
    # Notarization submits once, then polls that submission for about 5h, so
    # the poll stays inside this limit when the build finishes in time.
    # Other OS stay at 3h.
    timeout-minutes: ${{ contains(matrix.os, 'macos') && 360 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.include) }}

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          # Bundle group + build path; keep off the test cache key.
          cache-suffix: ${{ github.workflow }}-build
          prune-cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Cache Nuitka and ccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/Nuitka
            ~/Library/Caches/Nuitka
            ~/AppData/Local/Nuitka
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: uv sync --group bundle

      # Linux: fix_bundle_ocio uses patchelf for RPATH / SONAME rewrites.
      - name: Install patchelf (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends patchelf

      # Confirm PyOpenColorIO.so stays on OCIO 2.5 (not a stale/vendored library).
      - name: Ensure OpenColorIO 2.5+ linkage
        run: uv run python scripts/ensure_ocio.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: stable

      - name: Build oxideav ProRes extension
        run: uv run python scripts/build_oxideav_prores.py

      # Optional RED R3D SDK (private feed). Builds libr3d_bridge for packaging.
      # Secret R3D_SDK_READ_TOKEN must read derek-rein/r3d-sdk-private releases.
      # Without the secret, Release still ships; R3D convert reports SDK missing.
      - name: Fetch private R3D SDK
        id: r3d_sdk
        shell: bash
        env:
          R3D_SDK_READ_TOKEN: ${{ secrets.R3D_SDK_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${R3D_SDK_READ_TOKEN:-}" ]; then
            echo "R3D_SDK_READ_TOKEN not set — skipping R3D bridge"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SDK_ROOT="$(uv run python scripts/fetch_r3d_sdk.py --out "${RUNNER_TEMP}/r3d-sdk")"
          echo "R3D_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Fetched R3D SDK → ${SDK_ROOT}"

      - name: R3D bridge build deps (Linux)
        if: runner.os == 'Linux' && steps.r3d_sdk.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ uuid-dev

      # Optional Blackmagic RAW SDK (private feed). Builds libbraw_bridge.
      # Secret BRAW_SDK_READ_TOKEN must read derek-rein/braw-sdk-private releases.
      # Without the secret, Release still ships; BRAW convert reports SDK missing.
      - name: Fetch private BRAW SDK
        id: braw_sdk
        shell: bash
        env:
          BRAW_SDK_READ_TOKEN: ${{ secrets.BRAW_SDK_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BRAW_SDK_READ_TOKEN:-}" ]; then
            echo "BRAW_SDK_READ_TOKEN not set — skipping BRAW bridge"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SDK_ROOT="$(uv run python scripts/fetch_braw_sdk.py --out "${RUNNER_TEMP}/braw-sdk")"
          echo "BRAW_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "Fetched BRAW SDK → ${SDK_ROOT}"

      - name: BRAW bridge build deps (Linux)
        if: runner.os == 'Linux' && steps.braw_sdk.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++

      # Puts cl.exe / link.exe on PATH for R3D / BRAW native link steps.
      - name: Enable MSVC environment (Windows)
        if: runner.os == 'Windows' && (steps.r3d_sdk.outputs.enabled == 'true' || steps.braw_sdk.outputs.enabled == 'true')
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Build R3D bridge
        if: steps.r3d_sdk.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/build_r3d_bridge.py -v
          ls -la build/r3d/

      - name: Build BRAW bridge
        if: steps.braw_sdk.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/build_braw_bridge.py -v
          ls -la build/braw/

      - name: Compile Qt resources
        run: uv run pyside6-rcc resources.qrc -o src/rc_resources.py

      - name: Determine platform icon
        id: icon
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            echo "path=resources/icons/icon.icns" >> "$GITHUB_OUTPUT"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            echo "path=resources/icons/icon.ico" >> "$GITHUB_OUTPUT"
          else
            echo "path=resources/icons/icon.png" >> "$GITHUB_OUTPUT"
          fi

      - name: Build with Nuitka
        shell: bash
        run: |
          MODE="--standalone"
          EXTRA_FLAGS=()
          if [ "$RUNNER_OS" == "macOS" ]; then
            EXTRA_FLAGS+=(--macos-create-app-bundle "--macos-app-name=EXR Converter" "--macos-app-icon=${{ steps.icon.outputs.path }}")
            EXTRA_FLAGS+=("--macos-target-arch=${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}")
            # Display name stays "EXR Converter". The bundle id must be reverse-DNS
            # or notarization rejects it (Nuitka's default id is the display name).
            # Keep this in sync with macos_codesign.MACOS_BUNDLE_ID and the Makefile.
            EXTRA_FLAGS+=("--macos-signed-app-name=com.vfxtools.exrconverter")
            APP_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
            EXTRA_FLAGS+=("--macos-app-version=${APP_VERSION}")
            # Do not pass Nuitka --macos-sign-identity / --macos-sign-notarization.
            # lipo/strip below invalidate that signature, and Nuitka signs with
            # --deep, which fails on BlackmagicRawAPI.framework. Signing happens
            # after slimming in scripts/macos_codesign.py.
            # Do not --noinclude-dlls libssl/libcrypto: that breaks Python HTTPS
            # in the frozen app (urlopen "unknown url type: https") if anything
            # needs TLS later. Check for Updates uses the system browser.
          elif [ "$RUNNER_OS" == "Windows" ]; then
            EXTRA_FLAGS+=("--windows-icon-from-ico=${{ steps.icon.outputs.path }}" --windows-console-mode=disable)
          else
            EXTRA_FLAGS+=("--linux-icon=${{ steps.icon.outputs.path }}")
          fi
          # macos-26-intel runners OOM during Nuitka LTO link once exr_prores is
          # included; arm64/linux/windows tolerate --lto=yes.
          LTO_FLAG="--lto=yes"
          if [ "${{ matrix.os }}" == "macos-26-intel" ]; then
            LTO_FLAG="--lto=no"
          fi
          # Flags kept in sync with `make bundle` (shared strip set + LTO).
          uv run python -m nuitka \
            $MODE \
            --output-dir=dist \
            --output-filename=exr_converter \
            --assume-yes-for-downloads \
            --python-flag=-OO \
            "$LTO_FLAG" \
            --enable-plugin=pyside6 \
            --nofollow-import-to=tkinter \
            --nofollow-import-to=unittest \
            --nofollow-import-to=pydoc \
            --nofollow-import-to=PIL \
            --nofollow-import-to='PySide6.QtWebEngine*' \
            --noinclude-qt-translations \
            --noinclude-qt-plugins=printsupport,mediaservice,iconengines \
            --noinclude-dlls='*Qt6WebEngine*' \
            --noinclude-dlls='*Qt6Svg*' \
            --noinclude-dlls='*Qt6Pdf*' \
            --noinclude-dlls='*Qt6Positioning*' \
            --noinclude-dlls='*Qt6PrintSupport*' \
            --include-package-data=av \
            --include-package=OpenImageIO \
            --include-package-data=OpenImageIO \
            --include-package=PyOpenColorIO \
            --include-package-data=PyOpenColorIO \
            --include-package=fileseq \
            --include-package=OpenGL \
            --include-data-dir=resources/ocio=resources/ocio \
            --include-data-files=pyproject.toml=pyproject.toml \
            --include-module=ssl \
            --include-module=exr_prores \
            --quiet \
            "${EXTRA_FLAGS[@]}" \
            main.py

      - name: Rename macOS app bundle
        if: runner.os == 'macOS'
        run: mv dist/main.app "dist/EXR Converter.app"

      # Nuitka can flatten/relink PyOpenColorIO.so away from the 2.5 library.
      # Restore 2.5 from the build env and rewrite the install name.
      - name: Fix OpenColorIO 2.5 linkage in bundle
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            uv run python scripts/fix_bundle_ocio.py "dist/EXR Converter.app"
          else
            uv run python scripts/fix_bundle_ocio.py dist/main.dist
          fi
          if [ "$RUNNER_OS" == "Windows" ]; then
            echo "--- OCIO / OIIO DLLs in dist ---"
            find dist/main.dist -iname '*OpenColorIO*' -o -iname 'OpenImageIO*' 2>/dev/null | sort || true
            test -f dist/main.dist/OpenColorIO_2_5.dll \
              || find dist/main.dist -name 'OpenColorIO_2_5.dll' | grep -q . \
              || { echo "ERROR: OpenColorIO_2_5.dll missing from Windows bundle" >&2; exit 1; }
          fi

      # Ship only Redistributable dylibs/so/dll + our bridge (private app dir).
      # Never package SDK headers or static libs into the user-facing artifact.
      - name: Install R3D runtime into bundle
        if: steps.r3d_sdk.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" == "macOS" ]; then
            uv run python scripts/install_r3d_into_bundle.py "dist/EXR Converter.app"
          else
            uv run python scripts/install_r3d_into_bundle.py dist/main.dist
          fi
          # Sanity: no headers/static libs leaked into the private r3d dir.
          if [ "$RUNNER_OS" == "macOS" ]; then
            R3D_DIR="dist/EXR Converter.app/Contents/MacOS/r3d"
          else
            R3D_DIR="dist/main.dist/r3d"
          fi
          test -d "$R3D_DIR"
          if find "$R3D_DIR" \( -iname '*.a' -o -iname '*.lib' -o -iname 'R3DSDK.h' \) | grep -q .; then
            echo "ERROR: forbidden SDK artifacts under $R3D_DIR" >&2
            find "$R3D_DIR" | head -50
            exit 1
          fi
          echo "OK: R3D redistributables in $R3D_DIR"
          ls -la "$R3D_DIR" | head -20

      # Ship only runtime dylibs/so/dll + our bridge (private app dir).
      # Never package SDK headers or documentation into the user-facing artifact.
      - name: Install BRAW runtime into bundle
        if: steps.braw_sdk.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" == "macOS" ]; then
            uv run python scripts/install_braw_into_bundle.py "dist/EXR Converter.app"
          else
            uv run python scripts/install_braw_into_bundle.py dist/main.dist
          fi
          # Sanity: no headers/static libs leaked into the private braw dir.
          # macOS: Frameworks/braw (not MacOS/braw) so codesign --deep is not
          # ambiguous about a nested BlackmagicRawAPI.framework.
          if [ "$RUNNER_OS" == "macOS" ]; then
            BRAW_DIR="dist/EXR Converter.app/Contents/Frameworks/braw"
            if find "dist/EXR Converter.app/Contents/MacOS" -name '*.framework' | grep -q .; then
              echo "ERROR: .framework under Contents/MacOS (codesign --deep will fail)" >&2
              find "dist/EXR Converter.app/Contents/MacOS" -name '*.framework'
              exit 1
            fi
          else
            BRAW_DIR="dist/main.dist/braw"
          fi
          test -d "$BRAW_DIR"
          if find "$BRAW_DIR" \( -iname '*.a' -o -iname '*.lib' -o -iname 'BlackmagicRawAPI.h' -o -iname '*.h' \) | grep -q .; then
            echo "ERROR: forbidden SDK artifacts under $BRAW_DIR" >&2
            find "$BRAW_DIR" | head -50
            exit 1
          fi
          echo "OK: BRAW runtime in $BRAW_DIR"
          ls -la "$BRAW_DIR" | head -20

      - name: Slim macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP="dist/EXR Converter.app"
          ARCH="${{ runner.arch == 'ARM64' && 'arm64' || 'x86_64' }}"

          # Thin universal2 frameworks to single arch
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) -exec \
            sh -c 'lipo -info "$1" 2>/dev/null | grep -q "universal\|two arch" && lipo -thin '"$ARCH"' "$1" -output "$1.thin" && mv "$1.thin" "$1" || true' _ {} \;
          # Qt framework binaries (no .so/.dylib suffix) sit next to the PySide6
          # package, which Nuitka places under Contents/MacOS (not Resources).
          # Guard the path so a layout change can never fail the whole build.
          QT_LIB="$APP/Contents/MacOS/PySide6/Qt/lib"
          if [ -d "$QT_LIB" ]; then
            find "$QT_LIB" -type f ! -name '*.plist' ! -name '*.pri' -exec \
              sh -c 'lipo -info "$1" 2>/dev/null | grep -q "universal\|two arch" && lipo -thin '"$ARCH"' "$1" -output "$1.thin" && mv "$1.thin" "$1" || true' _ {} \;
          fi

          # Strip debug symbols (never strip private RED / Blackmagic
          # redistributables under r3d/ or braw/, or the oxideav PyO3
          # extension — strip can break extension load).
          find "$APP" -type f \( -name '*.dylib' -o -name '*.so' \) \
            ! -path '*/r3d/*' ! -path '*/braw/*' ! -path '*exr_prores*' -exec strip -x {} +

          echo "Bundle size after slimming:"
          du -sh "$APP"

      - name: Re-sign macOS bundle
        id: macos_sign
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP="dist/EXR Converter.app"
          # lipo/strip above rewrote Mach-O files and invalidated Nuitka's
          # ad-hoc signatures. On Apple Silicon every executable page needs a
          # valid signature or the kernel kills dlopen ("CODESIGNING /
          # Invalid Page").
          #
          # Do NOT pass --deep to codesign. BlackmagicRawAPI.framework
          # (SDK 6.0) is not a clean versioned framework: flattened
          # Versions/Current, top-level Resources/, Contents/, Libraries/,
          # PlugIns/, or a nested .bundle/.app make a deep sign report
          # "bundle format is ambiguous (could be app or framework)" even
          # when the tree lives under Contents/Frameworks/braw/ (PR #54).
          # scripts/macos_codesign.py signs Mach-Os deepest-first, then
          # each .framework without that flag, then the outer .app.
          # Developer ID verification (later) uses --verify --deep --strict.
          #
          # That script also moves non-Mach-O files (yaml, pyproject.toml,
          # OCIO configs, package data) from Contents/MacOS to
          # Contents/Resources and leaves relative symlinks. A real Developer
          # ID signature treats those files as unsigned nested code; ad-hoc
          # signing does not. The symlinks keep runtime lookups working.
          if find "$APP/Contents/MacOS" -name '*.framework' | grep -q .; then
            echo "ERROR: .framework under Contents/MacOS" >&2
            find "$APP/Contents/MacOS" -name '*.framework'
            exit 1
          fi

          have_p12=0
          have_pw=0
          have_id=0
          [ -n "${MACOS_CERT_P12_BASE64:-}" ] && have_p12=1
          [ -n "${MACOS_CERT_PASSWORD:-}" ] && have_pw=1
          [ -n "${MACOS_SIGNING_IDENTITY:-}" ] && have_id=1
          if [ "${have_p12}${have_pw}${have_id}" = "000" ]; then
            echo "macOS Developer ID certificate secrets are not set (MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, MACOS_SIGNING_IDENTITY)."
            echo "Using an ad-hoc signature and skipping notarization."
            uv run python scripts/macos_codesign.py "$APP"
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${have_p12}${have_pw}${have_id}" != "111" ]; then
            echo "ERROR: partial macOS signing secrets. Set all of MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD, and MACOS_SIGNING_IDENTITY, or none of them." >&2
            exit 1
          fi
          echo "Developer ID certificate secrets are set. Signing with hardened runtime; notarization follows the DMG step."
          # G2 Developer ID Application cert for team 83546T4BT8, expires 2031-09-17.
          # Compare without printing the secret value (GitHub may store a trailing newline).
          expected_identity="Developer ID Application: Medeu Global LLC (83546T4BT8)"
          got_identity="$(printf '%s' "$MACOS_SIGNING_IDENTITY" | tr -d '\r\n')"
          if [ "$got_identity" != "$expected_identity" ]; then
            echo "ERROR: MACOS_SIGNING_IDENTITY must be 'Developer ID Application: Medeu Global LLC (83546T4BT8)'." >&2
            exit 1
          fi
          MACOS_SIGNING_IDENTITY="$got_identity"
          MACOS_CERT_PASSWORD="$(printf '%s' "$MACOS_CERT_PASSWORD" | tr -d '\r\n')"
          if [ -n "${APPLE_TEAM_ID:-}" ]; then
            team_id="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n')"
            if [ "$team_id" != "83546T4BT8" ]; then
              echo "ERROR: APPLE_TEAM_ID must be 83546T4BT8" >&2
              exit 1
            fi
          fi

          KEYCHAIN="$RUNNER_TEMP/exr-signing.keychain-db"
          P12="$RUNNER_TEMP/developer-id.p12"
          cleanup_p12() { rm -f "$P12"; }
          trap cleanup_p12 EXIT
          KEYCHAIN_PASS="$(openssl rand -base64 24)"
          # PKCS#12 from `openssl pkcs12 -export -legacy` (certificate + private key).
          # macOS `security import` accepts that legacy profile. OpenSSL 3's default
          # AES-256 PKCS#12 fails import with "MAC verification failed".
          echo "Importing OpenSSL-legacy PKCS#12 into a temporary keychain."
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 -D > "$P12"
          chmod 600 "$P12"
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          if ! security import "$P12" \
            -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -f pkcs12; then
            echo "ERROR: security import failed. Re-export the p12 with OpenSSL 3: openssl pkcs12 -export -legacy (certificate and private key). Do not use OpenSSL 3's default AES-256 PKCS#12." >&2
            exit 1
          fi
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASS" \
            "$KEYCHAIN"
          keychains=("$KEYCHAIN")
          while IFS= read -r line; do
            line="${line//\"/}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -n "$line" ] || continue
            keychains+=("$line")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"
          rm -f "$P12"
          unset MACOS_CERT_P12_BASE64 MACOS_CERT_PASSWORD KEYCHAIN_PASS
          if ! security find-identity -p codesigning -v "$KEYCHAIN" | grep -F -- "$MACOS_SIGNING_IDENTITY" >/dev/null; then
            echo "ERROR: imported keychain has no codesigning identity matching MACOS_SIGNING_IDENTITY" >&2
            security find-identity -p codesigning -v "$KEYCHAIN" >&2
            exit 1
          fi
          uv run python scripts/macos_codesign.py \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN" \
            "$APP"
          echo "mode=developer-id" >> "$GITHUB_OUTPUT"

      - name: Slim Linux bundle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          DIST="dist/main.dist"
          # Never strip private RED / Blackmagic redistributables (license + ABI).
          find "$DIST" -type f \( -name '*.so' -o -name '*.so.*' -o -name 'exr_converter' \) \
            ! -path '*/r3d/*' ! -path '*/braw/*' -exec strip --strip-unneeded {} +
          echo "Bundle size after slimming:"
          du -sh "$DIST"

      - name: Slim Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DIST="dist/main.dist"
          echo "Bundle size after slimming:"
          du -sh "$DIST"

      - name: Install EGL (Linux smoke-test dependency)
        if: runner.os == 'Linux'
        run: |
          # Refresh the index first; the runner image's cached package list can
          # point at superseded .deb versions that 404 on the mirror.
          sudo apt-get update
          sudo apt-get install -y libegl1

      - name: List dist contents (debug)
        if: failure() || success()
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            find "dist/EXR Converter.app" -type f -name '*.dylib' -o -name '*.so' | sort
          else
            ls -la dist/main.dist/*.dll dist/main.dist/*.pyd dist/main.dist/*.so 2>/dev/null | sort || true
            echo "--- OpenImageIO dir ---"
            ls -la dist/main.dist/OpenImageIO/ 2>/dev/null || true
          fi

      - name: Verify bundled OCIO config is present
        shell: bash
        run: |
          CFG="resources/ocio/aces-studio-v4.ocio"
          if [ "$RUNNER_OS" == "macOS" ]; then
            ROOT="dist/EXR Converter.app"
          else
            ROOT="dist/main.dist"
          fi
          # The app resolves the config relative to the bundle, so it must ship
          # inside it. Search the whole tree (Nuitka may place data under
          # Contents/MacOS or Contents/Resources on macOS).
          cfgs=0
          bad=0
          while IFS= read -r cfg; do
            cfgs=$((cfgs + 1))
            lut="$(dirname "$cfg")/luts/nlog_to_lin.spi1d"
            if [ -f "$lut" ]; then
              echo "OK: bundled OCIO config and N-Log LUT:"
              echo "  $cfg"
              echo "  $lut"
            else
              echo "ERROR: $cfg is missing sibling luts/nlog_to_lin.spi1d" >&2
              bad=1
            fi
          done < <(find "$ROOT" -type f -name 'aces-studio-v4.ocio')
          if [ "$cfgs" -eq 0 ] || [ "$bad" -ne 0 ]; then
            echo "ERROR: $CFG was not bundled into $ROOT with luts/nlog_to_lin.spi1d beside it" >&2
            exit 1
          fi

      - name: Smoke test
        shell: bash
        timeout-minutes: 1
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            "dist/EXR Converter.app/Contents/MacOS/exr_converter" --smoke-test
          elif [ "$RUNNER_OS" == "Windows" ]; then
            dist/main.dist/exr_converter.exe --smoke-test
          else
            dist/main.dist/exr_converter --smoke-test
          fi

      - name: Integration test (built binary)
        shell: bash
        timeout-minutes: 10
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            export EXR_CONVERTER_BIN="dist/EXR Converter.app/Contents/MacOS/exr_converter"
          elif [ "$RUNNER_OS" == "Windows" ]; then
            export EXR_CONVERTER_BIN="dist/main.dist/exr_converter.exe"
          else
            export EXR_CONVERTER_BIN="dist/main.dist/exr_converter"
          fi
          uv sync --group dev
          uv run pytest tests/test_integration_conversions.py -v -m integration

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # GitHub's macos-*-intel images sometimes ship third-party taps
          # (e.g. aws/tap) that Homebrew now refuses without explicit trust.
          # That prints a scary warning but doesn't affect homebrew-core
          # formulae — still, drop untrusted taps so logs stay clean.
          for tap in $(brew tap 2>/dev/null); do
            case "$tap" in
              homebrew/*|Homebrew/*) ;;
              *) brew untap "$tap" 2>/dev/null || true ;;
            esac
          done
          brew install create-dmg
          create-dmg \
            --volname "EXR Converter" \
            --volicon "resources/icons/icon.icns" \
            --format ULMO \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "EXR Converter.app" 150 190 \
            --hide-extension "EXR Converter.app" \
            --app-drop-link 450 190 \
            --overwrite \
            "${{ matrix.artifact }}.${{ matrix.ext }}" \
            "dist/EXR Converter.app"

      - name: Notarize and staple macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          mode="${{ steps.macos_sign.outputs.mode }}"
          DMG="${{ matrix.artifact }}.${{ matrix.ext }}"
          if [ "$mode" != "developer-id" ]; then
            echo "Skipping notarization: macOS bundle was ad-hoc signed (Developer ID certificate secrets are not set)."
            exit 0
          fi
          if [ -z "${ASC_API_KEY_P8:-}" ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ]; then
            echo "ERROR: Developer ID signing ran but ASC_API_KEY_P8, ASC_KEY_ID, or ASC_ISSUER_ID is missing." >&2
            echo "Refusing to publish a Developer ID DMG that was not notarized." >&2
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/exr-signing.keychain-db"
          P8="$RUNNER_TEMP/AuthKey.p8"
          SUBMIT_JSON="$RUNNER_TEMP/notary-submit.json"
          cleanup_p8() { rm -f "$P8"; }
          trap cleanup_p8 EXIT
          umask 077
          printf '%s\n' "$ASC_API_KEY_P8" > "$P8"
          unset ASC_API_KEY_P8
          # create-dmg copies the signed app. Re-check the bundle before the
          # notary upload so a broken signature fails here, not after upload.
          codesign --verify --deep --strict --verbose=2 "dist/EXR Converter.app"
          uv run python scripts/macos_codesign.py \
            --dmg "$DMG" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --keychain "$KEYCHAIN"

          # One upload, without blocking on Apple. The submission id is in the
          # JSON as soon as the upload is accepted. Poll `notarytool info` on
          # that id for about 5h (under the 6h job cap). Never submit again.
          POLL_BUDGET_SECONDS=18000
          POLL_INTERVAL_SECONDS=60
          INFO_CALL_TIMEOUT_SECONDS=120
          INFO_JSON="$RUNNER_TEMP/notary-info.json"
          notary_field() {
            python3 - "$1" "$2" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          field = sys.argv[2]
          raw = path.read_text(encoding="utf-8") if path.is_file() else ""
          try:
              doc = json.loads(raw)
          except json.JSONDecodeError:
              doc = {}
          if not isinstance(doc, dict):
              doc = {}
          value = doc.get(field) or ""
          if not isinstance(value, str):
              value = str(value)
          print(value)
          PY
          }
          fetch_notary_log() {
            echo "--- notary log ${sub_id} ---" >&2
            xcrun notarytool log "$sub_id" \
              --key "$P8" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" >&2 || true
          }
          # Bound one info call. A hung request must not stall the poll, and
          # killing the process group covers xcrun's child. Exit 124 is transient.
          run_with_timeout() {
            local seconds="$1"
            shift
            python3 - "$seconds" "$@" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          seconds = int(sys.argv[1])
          cmd = sys.argv[2:]
          proc = subprocess.Popen(cmd, start_new_session=True)
          try:
              rc = proc.wait(timeout=seconds)
          except subprocess.TimeoutExpired:
              os.killpg(proc.pid, signal.SIGTERM)
              try:
                  proc.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  os.killpg(proc.pid, signal.SIGKILL)
                  proc.wait()
              sys.exit(124)
          sys.exit(rc)
          PY
          }
          submit_status=0
          xcrun notarytool submit "$DMG" \
            --key "$P8" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --output-format json \
            >"$SUBMIT_JSON" || submit_status=$?
          if [ -s "$SUBMIT_JSON" ]; then
            cat "$SUBMIT_JSON"
          fi
          sub_id="$(notary_field "$SUBMIT_JSON" id)"
          if [ -z "$sub_id" ]; then
            echo "ERROR: notarytool submit did not return a submission id (exit ${submit_status}); not resubmitting." >&2
            exit 1
          fi
          echo "notary submission id=${sub_id}"
          if [ "$submit_status" -ne 0 ]; then
            echo "notarytool submit exited ${submit_status} with id ${sub_id}; polling that submission (not resubmitting)." >&2
          fi
          notary_status="$(notary_field "$SUBMIT_JSON" status)"
          echo "notary status: ${notary_status:-unknown} id=${sub_id} (submit exit ${submit_status})"
          if [ "$notary_status" = "Invalid" ] || [ "$notary_status" = "Rejected" ]; then
            echo "ERROR: notarization ${notary_status} (id ${sub_id})" >&2
            fetch_notary_log
            exit 1
          fi
          if [ "$notary_status" != "Accepted" ]; then
            echo "polling notarytool info for ${sub_id} every ${POLL_INTERVAL_SECONDS}s for up to ${POLL_BUDGET_SECONDS}s (not resubmitting)."
            poll_deadline=$((SECONDS + POLL_BUDGET_SECONDS))
            while [ "$notary_status" != "Accepted" ]; do
              if [ "$SECONDS" -ge "$poll_deadline" ]; then
                echo "ERROR: notarization still ${notary_status:-in progress} after ${POLL_BUDGET_SECONDS}s (id ${sub_id}); not resubmitting." >&2
                exit 1
              fi
              info_status=0
              run_with_timeout "$INFO_CALL_TIMEOUT_SECONDS" \
                xcrun notarytool info "$sub_id" \
                --key "$P8" \
                --key-id "$ASC_KEY_ID" \
                --issuer "$ASC_ISSUER_ID" \
                --output-format json \
                >"$INFO_JSON" || info_status=$?
              notary_status="$(notary_field "$INFO_JSON" status)"
              echo "notary status: ${notary_status:-unknown} id=${sub_id} (info exit ${info_status})"
              if [ "$notary_status" = "Accepted" ]; then
                break
              fi
              if [ "$notary_status" = "Invalid" ] || [ "$notary_status" = "Rejected" ]; then
                echo "ERROR: notarization ${notary_status} (id ${sub_id})" >&2
                if [ -s "$INFO_JSON" ]; then
                  cat "$INFO_JSON" >&2
                fi
                fetch_notary_log
                exit 1
              fi
              if [ "$info_status" -ne 0 ] || [ -z "$notary_status" ]; then
                echo "notarytool info failed (exit ${info_status}, id ${sub_id}); retrying (not resubmitting)." >&2
              fi
              remaining=$((poll_deadline - SECONDS))
              if [ "$remaining" -le 0 ]; then
                echo "ERROR: notarization still ${notary_status:-in progress} after ${POLL_BUDGET_SECONDS}s (id ${sub_id}); not resubmitting." >&2
                exit 1
              fi
              sleep_for=$POLL_INTERVAL_SECONDS
              if [ "$remaining" -lt "$sleep_for" ]; then
                sleep_for=$remaining
              fi
              echo "submission ${sub_id} still ${notary_status:-in progress}; sleeping ${sleep_for}s (not resubmitting)."
              sleep "$sleep_for"
            done
          fi
          echo "notary status: Accepted id=${sub_id}"

          stapled=0
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$DMG"; then
              stapled=1
              break
            fi
            echo "stapler staple failed (attempt ${attempt}); waiting 15s for the ticket" >&2
            sleep 15
          done
          if [ "$stapled" -ne 1 ]; then
            echo "ERROR: stapler staple failed after retries" >&2
            exit 1
          fi
          echo "--- stapler validate ${DMG} ---"
          xcrun stapler validate "$DMG"
          codesign --verify --deep --strict --verbose=2 "$DMG"
          echo "--- spctl -a -vvv -t install ${DMG} ---"
          assessed=0
          for attempt in 1 2 3 4 5 6; do
            if spctl -a -vvv -t install "$DMG"; then
              assessed=1
              break
            fi
            echo "spctl rejected the DMG (attempt ${attempt}); waiting 10s" >&2
            sleep 10
          done
          if [ "$assessed" -ne 1 ]; then
            echo "ERROR: Gatekeeper assessment failed for ${DMG}" >&2
            exit 1
          fi
          echo "Notarized and stapled ${DMG}"

      - name: Remove temporary macOS signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          security delete-keychain "$RUNNER_TEMP/exr-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8" \
            "$RUNNER_TEMP/notary-submit.json" "$RUNNER_TEMP/notary-info.json"
          echo "Removed temporary keychain and signing files (if any)."

      - name: Create AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          APPDIR="${{ matrix.artifact }}.AppDir"
          mkdir -p "${APPDIR}/usr/bin" "${APPDIR}/usr/share/icons/hicolor/256x256/apps"

          cp -a dist/main.dist/. "${APPDIR}/usr/bin/"
          chmod +x "${APPDIR}/usr/bin/exr_converter"
          cp resources/icons/icon.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/exr_converter.png"
          cp resources/icons/icon.png "${APPDIR}/exr_converter.png"

          printf '[Desktop Entry]\nName=EXR Converter\nExec=exr_converter\nIcon=exr_converter\nType=Application\nCategories=Graphics;\n' \
            > "${APPDIR}/exr_converter.desktop"

          printf '#!/bin/bash\nSELF="$(readlink -f "$0")"\nHERE="$(dirname "$SELF")"\nexec "$HERE/usr/bin/exr_converter" "$@"\n' \
            > "${APPDIR}/AppRun"
          chmod +x "${APPDIR}/AppRun"

          # Pin a release tag (not "continuous") for reproducible packaging.
          APPIMAGETOOL_VER="1.9.1"
          APPIMAGETOOL_SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          curl -fSL -o appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VER}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          ARCH=x86_64 VERSION="${VERSION}" ./appimagetool \
            --no-appstream --comp zstd \
            "${APPDIR}" "${{ matrix.artifact }}.${{ matrix.ext }}"

      - name: Rename standalone folder (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Rename-Item dist\main.dist exr_converter

      - name: Create installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ env.RELEASE_TAG }}".Replace("v","")
          # windows-* images currently ship Inno Setup 6; fail clearly if gone.
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            foreach ($p in $candidates) {
              if (Test-Path $p) { $iscc = @{ Source = $p }; break }
            }
          }
          if (-not $iscc) {
            throw "iscc (Inno Setup) not found on runner — install Inno Setup 6 or update this step"
          }
          $isccPath = if ($iscc.Source) { $iscc.Source } else { $iscc.Path }
          & $isccPath "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # macos_only artifacts are the notarized DMGs. Distinct name so a
          # signing test is not confused with a published release asset.
          name: ${{ (github.event_name == 'workflow_dispatch' && inputs.macos_only) && format('{0}-signed', matrix.artifact) || matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.ext }}

  # ── SignPath Foundation (Windows Authenticode) — optional ────────────────
  # Free for qualifying open-source projects. Eliminates SmartScreen warnings.
  #
  # Enable by setting repository variables + secrets (see AGENTS.md):
  #   vars:  SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG,
  #          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG (optional, default exr_converter)
  #   secrets: SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID
  #   + SignPath GitHub App installed on this repo
  #
  # When vars.SIGNPATH_PROJECT_SLUG is empty, this job is skipped.
  # Must run *before* Cosign so signatures cover the Authenticode binary.
  sign-windows:
    if: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && !(github.event_name == 'workflow_dispatch' && inputs.macos_only) }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: exr_converter-windows-x86_64-setup
          path: unsigned

      # SignPath requires github-artifact-id from upload-artifact in *this* job.
      - name: Re-upload Windows setup for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-setup-for-signpath
          path: unsigned/*
          retention-days: 1

      - name: Submit Windows installer to SignPath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'exr_converter' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Normalize signed installer name
        shell: bash
        run: |
          set -euo pipefail
          # Ensure the signed binary keeps the release asset name.
          mkdir -p signed-out
          found=$(find signed -type f -name '*.exe' | head -1)
          test -n "$found"
          cp "$found" signed-out/exr_converter-windows-x86_64-setup.exe
          ls -la signed-out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exr_converter-windows-x86_64-setup-signed
          path: signed-out/exr_converter-windows-x86_64-setup.exe

  # ── Cosign (Sigstore keyless) + GitHub build provenance ───────────────────
  # Runs after optional SignPath so Cosign/attest cover the final Windows bits.
  # macOS DMGs are already Developer ID-signed, notarized, and stapled inside
  # the build job (or left ad-hoc when those secrets are unset), so the hashes
  # below match the files users download.
  sign:
    needs: [build, sign-windows]
    # macos_only uploads the DMGs from the build job and skips Cosign. A full
    # publish=false run still Cosigns; it just does not create a GitHub Release.
    if: ${{ always() && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && inputs.macos_only) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloaded

      - name: Assemble final binaries for signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          for name in \
            exr_converter-linux-x86_64 \
            exr_converter-macos-arm64 \
            exr_converter-macos-x86_64
          do
            test -d "downloaded/${name}"
            cp -a "downloaded/${name}/." artifacts/
          done
          WIN_SIGNED="downloaded/exr_converter-windows-x86_64-setup-signed"
          WIN_UNSIGNED="downloaded/exr_converter-windows-x86_64-setup"
          if [ -d "$WIN_SIGNED" ]; then
            echo "Cosign target: SignPath-signed Windows installer"
            cp -a "${WIN_SIGNED}/." artifacts/
          else
            echo "Cosign target: unsigned Windows installer (SignPath not enabled)"
            test -d "$WIN_UNSIGNED"
            cp -a "${WIN_UNSIGNED}/." artifacts/
          fi
          echo "--- artifacts to sign ---"
          ls -la artifacts/
          test "$(find artifacts -type f | wc -l)" -ge 4

      # SLSA-style build provenance stored in GitHub Attestations.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/*.AppImage
            artifacts/*.dmg
            artifacts/*.exe

      - name: Sign all artifacts with Cosign
        shell: bash
        run: |
          set -euo pipefail
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.sigstore.json) continue ;;
            esac
            echo "Signing $f ..."
            cosign sign-blob "$f" \
              --bundle "${f}.sigstore.json" \
              --yes
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: artifacts/*

  release:
    needs: sign
    # sign may depend on a *skipped* optional sign-windows job. GitHub treats a
    # skipped job in the needs chain as non-success for the default success()
    # gate, so we must re-check needs.sign.result explicitly or publish never runs.
    # macos_only and publish=false never create a GitHub Release.
    if: ${{ always() && needs.sign.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.macos_only != true)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Verify release asset set
        shell: bash
        run: |
          set -euo pipefail
          echo "--- release-assets ---"
          ls -la release-assets/
          test "$(find release-assets -type f ! -name '*.sigstore.json' | wc -l)" -ge 4
          test "$(find release-assets -type f -name '*.sigstore.json' | wc -l)" -ge 4

      - name: Build release notes from CHANGELOG
        shell: bash
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          {
            echo "## Changelog"
            echo
            python3 scripts/extract_changelog_section.py "${VERSION}"
            echo
            echo "## Verify artifact signatures"
            echo
            echo "### Cosign (Sigstore keyless)"
            echo
            echo "All release artifacts are signed with [Sigstore Cosign](https://docs.sigstore.dev/) (keyless)."
            echo "Each artifact has a matching \`.sigstore.json\` bundle."
            echo
            echo '```bash'
            echo "# Install cosign: https://docs.sigstore.dev/cosign/system_config/installation/"
            echo "# Identity is release.yml on main (auto-tag dispatch) or on tags/v* (tag push)."
            echo "cosign verify-blob <ARTIFACT_FILE> \\"
            echo "  --bundle <ARTIFACT_FILE>.sigstore.json \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp 'https://github.com/derek-rein/exr-converter/\\.github/workflows/release\\.yml@refs/(heads/main|tags/v.+)'"
            echo '```'
            echo
            echo "### GitHub build provenance"
            echo
            echo "Additionally, SLSA-style provenance is published to GitHub Attestations:"
            echo
            echo '```bash'
            echo "gh attestation verify <ARTIFACT_FILE> -R derek-rein/exr-converter"
            echo '```'
            echo
            if [ -n "${MACOS_CERT_P12_BASE64:-}" ] && [ -n "${MACOS_CERT_PASSWORD:-}" ] && [ -n "${MACOS_SIGNING_IDENTITY:-}" ]; then
              echo "### macOS"
              echo
              echo "These DMGs are signed with a Developer ID Application certificate, notarized by Apple, and stapled."
              echo "Gatekeeper should open them without an unidentified-developer warning."
              echo
              echo '```bash'
              echo "spctl -a -vvv -t install <DMG>"
              echo "codesign --verify --deep --strict --verbose=2 <DMG>"
              echo '```'
            else
              echo "### macOS note"
              echo
              echo "These builds use an **ad-hoc** code signature (Developer ID certificate secrets were not set for this release)."
              echo "On first launch, right-click the app and select **Open**, or run:"
              echo
              echo '```bash'
              echo 'xattr -cr "/Applications/EXR Converter.app"'
              echo '```'
            fi
            echo
            echo "### Windows note"
            echo
            echo "Unless SignPath Authenticode is enabled for this release, Windows SmartScreen"
            echo "may warn on first run. Prefer the Cosign/\`gh attestation\` checks above."
          } > release-notes.md
          echo "--- release-notes.md ---"
          head -40 release-notes.md

      - name: Create GitHub Release
        # v3 targets Node 24 (v2.x still declares Node 20 → deprecation annotations)
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "EXR Converter ${{ env.RELEASE_TAG }}"
          generate_release_notes: true
          files: release-assets/*
          body_path: release-notes.md
