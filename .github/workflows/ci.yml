name: CI

# Cost notes (GitHub Actions minutes):
# - Runs on PRs to main and manual dispatch only. Pushes to main are already
#   covered by the PR that merged them (main requires CI), so no push trigger.
# - Linux lint + tests always run. macOS (10x) and Windows (2x) tests run only
#   when the PR touches code/build inputs, or on manual dispatch. When they are
#   skipped, the check still reports "skipped", which satisfies the required
#   status checks "test (macos-latest)" / "test (windows-latest)".
# - The Release workflow runs the full 3-OS suite again before every build.
on:
  pull_request:
    branches: [main]
    # No paths-ignore: a docs-only PR must still report the required checks or
    # it can never merge. The `changes` job below skips macOS/Windows tests
    # when only docs/site files changed, so those PRs only cost a Linux run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect code changes that need cross-platform tests
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "$changed"
          if echo "$changed" | grep -qE '^(src/|native/|tests/|scripts/|packaging/|resources/|integrations/|main\.py$|pyproject\.toml$|uv\.lock$|resources\.qrc$|installer\.iss$|Makefile$|\.github/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.3"
          enable-cache: true
          # Same key as test (ubuntu) so we can restore what test saved;
          # do not save here or we race the concurrent test job.
          cache-suffix: CI
          save-cache: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Ensure OpenColorIO 2.5+ linkage
        run: uv run python scripts/ensure_ocio.py

      - name: Ruff check
        run: uv run ruff check src/ main.py tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ main.py tests/

      - name: Typecheck (basedpyright)
        run: uv run basedpyright src/ main.py

  test-linux:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-test

  test-macos:
    name: test (macos-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-test

  test-windows:
    name: test (windows-latest)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/ci-test

  # Single aggregate check used by branch protection / required status.
  ci-ok:
    if: always()
    needs: [lint, test-linux, test-macos, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require lint + tests green (skipped cross-OS cells are OK)
        shell: bash
        run: |
          echo "lint=${{ needs.lint.result }} linux=${{ needs.test-linux.result }} macos=${{ needs.test-macos.result }} windows=${{ needs.test-windows.result }}"
          [ "${{ needs.lint.result }}" = "success" ] || { echo "Lint failed" >&2; exit 1; }
          [ "${{ needs.test-linux.result }}" = "success" ] || { echo "Linux tests failed" >&2; exit 1; }
          for r in "${{ needs.test-macos.result }}" "${{ needs.test-windows.result }}"; do
            case "$r" in success|skipped) ;; *) echo "Cross-OS tests failed: $r" >&2; exit 1;; esac
          done
          echo "CI gate passed"
