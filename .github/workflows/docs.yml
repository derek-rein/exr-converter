# Check that the Astro docs (docs/ + site/) build. The public site is hosted on
# Vercel at https://exr-converter.derekvfx.ca/ (Root Directory = site, config in
# site/vercel.json). On main, GitHub Pages serves only a redirect so old
# derek-rein.github.io/exr-converter/ links land on the same page there.

name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "site/**"
      - "resources/screenshots/**"
      - "resources/icons/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "site/**"
      - "resources/screenshots/**"
      - "resources/icons/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build
        run: |
          npm ci --prefix site
          npm run build --prefix site

      - name: Write redirect to the Vercel site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p pages-redirect
          cat > pages-redirect/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>EXR Converter docs have moved</title>
          <link rel="canonical" href="https://exr-converter.derekvfx.ca/">
          <meta http-equiv="refresh" content="0; url=https://exr-converter.derekvfx.ca/">
          <script>
            var p = location.pathname.replace(/^\/exr-converter(?=\/|$)/, "") || "/";
            location.replace("https://exr-converter.derekvfx.ca" + p + location.search + location.hash);
          </script>
          <p>The docs moved to <a href="https://exr-converter.derekvfx.ca/">exr-converter.derekvfx.ca</a>.</p>
          HTML
          cp pages-redirect/index.html pages-redirect/404.html

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-redirect

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
